[project]
name = "libresprite-mcp"
version = "0.1.0"
description = "MCP server for drawing and animating LibreSprite sprites, ported from aseprite-mcp"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.0",
    "numpy>=2.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
libresprite-mcp = "libresprite_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libresprite_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
